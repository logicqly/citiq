server {
    # envsubst fills ${PORT}, ${API_HOST} and ${NGINX_LOCAL_RESOLVERS} from the
    # environment at container start (nginx templates feature). It only
    # substitutes names that exist in the environment, so nginx's own $variables
    # below are left alone.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Resolve the API host per request rather than once at startup.
    #
    # A literal hostname in proxy_pass is resolved when nginx parses the config,
    # and nginx exits with "host not found in upstream" if that lookup fails.
    # On Railway the API is reached over the private network, so a cold start
    # where api is not up yet, or any api redeploy, would take this container
    # down with it. Routing through a variable defers the lookup to request
    # time, which needs an explicit resolver.
    #
    # NGINX_LOCAL_RESOLVERS is written from /etc/resolv.conf by the image's
    # 15-local-resolvers entrypoint script, which runs before envsubst.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # Railway: API_HOST=http://api.railway.internal:8000 (private network, so
    # the API needs no public domain).

    # Proxy /api/* → FastAPI backend (strips the /api prefix)
    location /api/ {
        set $api_upstream ${API_HOST};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy /client/* → FastAPI backend (preserves the /client/ prefix)
    # Used by: /client/auth/login, /client/auth/me, /client/dashboard/*
    location /client/ {
        set $api_upstream ${API_HOST};
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
